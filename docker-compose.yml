# =============================================================================
# MediaStack - Turnkey Media Server for Friends & Family
# =============================================================================
# Usage:
#   Core stack:       docker compose up -d
#   + Reverse proxy:  docker compose --profile proxy up -d
#   + VPN:            docker compose --profile remote up -d
#
# Resource limits + GPU: setup.sh generates docker-compose.override.yml.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Compose merges security_opt lists by append; do not re-add this in
# docker-compose.override.yml.
x-security-opt: &default-security-opt
  - no-new-privileges:true

networks:
  mediastack:
    name: mediastack
    driver: bridge
    # Every bridge-network container is pinned to a static IP (see each
    # service's ipv4_address). Two reasons this is all-or-nothing:
    #
    # 1. Jellyfin's KnownProxies caches DNS lookups at startup
    #    (jellyfin/jellyfin#14731, closed not-planned), so the proxy must
    #    be a literal IP — hostname "npm" goes stale after any network
    #    rebuild. Pinning only npm wasn't enough: Docker's IPAM allocates
    #    dynamic IPs from .2 upward, and any service that started before
    #    npm could grab the pinned slot first ("Address already in use").
    # 2. With every container pinned, dynamic allocation never runs, so
    #    no race window exists. Adding a new service requires assigning
    #    a free host octet in this subnet (current map: see docs/project/structure.md).
    #
    # setup.sh writes MEDIASTACK_NETWORK_PREFIX to .env after checking host
    # routes and Docker networks for collisions. Defaults stay inside Docker's
    # conventional 172.16.0.0/12 range so qBittorrent's Docker subnet
    # whitelist and firewall assumptions remain valid.
    ipam:
      config:
        - subnet: ${MEDIASTACK_SUBNET:-172.28.0.0/24}
          gateway: ${MEDIASTACK_GATEWAY:-172.28.0.1}

services:
  # ---------------------------------------------------------------------------
  # Jellyfin - Media Server
  # ---------------------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    # Official image runs as root internally - use env vars not user: directive
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin:/config
      - ./config/jellyfin/cache:/cache
      - ${DATA_DIR}:/data:ro
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.20
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Sonarr - TV Show Management
  # ---------------------------------------------------------------------------
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ./config/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "8989:8989"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.22
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    depends_on:
      jackett:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Radarr - Movie Management
  # ---------------------------------------------------------------------------
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ./config/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "7878:7878"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.23
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    depends_on:
      jackett:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Jackett - Torrent Indexer Proxy
  # ---------------------------------------------------------------------------
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/jackett:/config
    ports:
      - "9117:9117"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.30
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # qBittorrent - Torrent Client
  # ---------------------------------------------------------------------------
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_DIR}:/data
    ports:
      - "8080:8080"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.25
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # FlareSolverr - Cloudflare Bypass for Jackett
  # ---------------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.31
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8191/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ---------------------------------------------------------------------------
  # Seerr - Media Request Management
  # ---------------------------------------------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.21
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    depends_on:
      jellyfin:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Unpackerr - Archive Extraction for Downloads
  # ---------------------------------------------------------------------------
  unpackerr:
    image: ghcr.io/hotio/unpackerr:latest
    container_name: unpackerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      - UN_LOG_FILE=/config/unpackerr.log
      - UN_LOG_FILE_MB=10
      - UN_MAX_RETRIES=3
      - UN_RETRY_DELAY=5m
      - UN_DELETE_DELAY=5m
      # Sonarr integration
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=${UNPACKERR_TORRENT_PATHS-/data/torrents}
      # Radarr integration
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=${UNPACKERR_TORRENT_PATHS-/data/torrents}
    volumes:
      - ./config/unpackerr:/config
      - ${DATA_DIR}:/data
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.32
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "unpackerr"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Bazarr - Subtitle Management (subtitles profile)
  # ---------------------------------------------------------------------------
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    profiles: [subtitles]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - ./config/bazarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "6767:6767"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.24
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Homepage - Dashboard
  # ---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ./config/homepage:/app/config
      - ${DATA_DIR}:/data:ro
      - /sys:/sys:ro
    ports:
      - "3000:3000"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.40
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Portainer CE - Container Management UI
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/portainer:/data
      # Root-equivalent by design: Portainer must create, start, and remove
      # containers, so it keeps the raw socket. A write-enabled socket-proxy
      # would grant the same power. ":ro" limits the bind mount, not the Docker
      # API. Portainer is the only service besides socket-proxy that mounts it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9000:9000"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.41
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    # Portainer CE is a distroless image (no shell, no curl, no wget).
    # The upstream image declares a wget healthcheck that always fails.
    # Disable it — Portainer has no dependents, so running status suffices.
    healthcheck:
      test: ["NONE"]

  # ---------------------------------------------------------------------------
  # Nginx Proxy Manager - Reverse Proxy + SSL (built-in Let's Encrypt)
  # ---------------------------------------------------------------------------
  npm:
    image: jc21/nginx-proxy-manager:2
    container_name: npm
    profiles: [proxy]
    environment:
      - LE_SERVER=${NPM_LE_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      # Admin UI — default creds (admin@example.com / changeme) are rotated
      # automatically by scripts/configure.sh using the shared admin password
      # (JELLYFIN_ADMIN_PASSWORD). Keep port 81 LAN-only: do not port-forward
      # on your router.
      - "81:81"
    volumes:
      - ./config/npm/data:/data
      - ./config/npm/letsencrypt:/etc/letsencrypt
    networks:
      mediastack:
        # Pinned so Jellyfin's KnownProxies can trust this IP literal.
        # See network-level comment above for rationale.
        ipv4_address: ${MEDIASTACK_NPM_IP:-172.28.0.10}
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Fail2ban - Intrusion Prevention
  # Proxy profile — only needed when a domain is configured and
  # ports 80/443 are forwarded for external access.
  # ---------------------------------------------------------------------------
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    profiles: [proxy]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ}
      - F2B_LOG_TARGET=STDOUT
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=7d
    volumes:
      - ./config/fail2ban:/data
      - ./config/jellyfin/log:/var/log/jellyfin:ro
      - ./config/npm/data/logs:/var/log/npm:ro
      - ./config/seerr/logs:/var/log/seerr:ro
    depends_on:
      - npm
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # DDNS Updater - Dynamic DNS for users with changing home IPs
  # ---------------------------------------------------------------------------
  ddns-updater:
    image: qmcgaw/ddns-updater:latest
    container_name: ddns-updater
    profiles: [proxy]
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.50
    ports:
      - "8000:8000"
    volumes:
      - ./config/ddns-updater:/updater/data
    environment:
      - TZ=${TZ}
      - PERIOD=5m
    restart: unless-stopped
    security_opt: *default-security-opt
    # Smaller rotation than the shared default. When a provider call fails at
    # the network layer, upstream logs the whole request URL, and the Dynu URL
    # carries the password. Upstream has no redaction setting, so keep that
    # text in the log for days, not months. See the ddns-updater-credential-logs
    # decision record.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    # Mirrors image-baked healthcheck — defensive override guards against silent upstream drift.
    healthcheck:
      test: ["CMD", "/updater/ddns-updater", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Uptime Kuma - Service Health Monitoring
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    environment:
      - TZ=${TZ}
      - UPTIME_KUMA_DB_TYPE=sqlite
    volumes:
      - ./config/uptime-kuma:/app/data
    ports:
      - "3001:3001"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.42
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Beszel Hub - System Resource Monitoring Dashboard
  # ---------------------------------------------------------------------------
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    environment:
      - TZ=${TZ}
      - USER_EMAIL=${NPM_ADMIN_EMAIL}
      - USER_PASSWORD=${JELLYFIN_ADMIN_PASSWORD}
    volumes:
      - ./config/beszel:/beszel_data
    ports:
      - "8090:8090"
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.43
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Beszel Agent - Host Resource Collector
  # ---------------------------------------------------------------------------
  beszel-agent:
    image: henrygd/beszel-agent:alpine
    container_name: beszel-agent
    network_mode: host
    volumes:
      - ./config/beszel/socket:/beszel_socket
    environment:
      # Unix socket shared with the hub, not a TCP port: host networking would
      # otherwise bind it on every host interface, where the DOCKER-USER
      # admin-port chain never sees it. The hub reaches the same file as
      # /beszel_data/socket/beszel.sock (see configure_beszel).
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_AGENT_KEY:-}
      - HUB_URL=http://localhost:8090
      # Docker API through the socket-proxy, never the raw socket. Both are in
      # the host network namespace, so this is the proxy's loopback listener
      # (see socket-proxy).
      - DOCKER_HOST=tcp://127.0.0.1:23750
      # The image-update check calls GET /images/{name}/json, which the proxy
      # does not allow. Stable installs are digest-pinned and updated from the
      # day-2 menu, so Beszel's own check adds only registry traffic.
      - DOCKER_IMAGE_CHECK=false
    depends_on:
      beszel:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # WireGuard (wg-easy) - VPN with Web UI (remote access profile)
  # ---------------------------------------------------------------------------
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wireguard
    profiles:
      - remote
    environment:
      - INIT_ENABLED=${WG_INIT_ENABLED:-true}
      - INIT_USERNAME=${JELLYFIN_ADMIN_USER}
      - INIT_PASSWORD=${WG_INIT_PASSWORD}
      - INIT_HOST=${WG_HOST}
      - INIT_PORT=${WG_PORT:-51820}
      - INIT_DNS=${WG_DEFAULT_DNS}
      # Initial peer's client-side AllowedIPs. Wizard sets this from WG_ACCESS_TIER
      # (full-lan/server/containers/streaming). Fallback is a safe split-routing
      # default so a missing key never re-enables full-tunnel by accident — power
      # users wanting full tunnel set WG_INIT_ALLOWED_IPS='0.0.0.0/0, ::/0' AND
      # WG_PER_CLIENT_FIREWALL=false in .env. See README "Advanced" section.
      - INIT_ALLOWED_IPS=${WG_INIT_ALLOWED_IPS:-192.168.0.0/16}
      - INIT_IPV4_CIDR=10.8.0.0/24
      - PORT=51821
      - INSECURE=true
      - DISABLE_IPV6=true
    volumes:
      - ./config/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    networks:
      mediastack:
        ipv4_address: ${MEDIASTACK_NETWORK_PREFIX:-172.28.0}.11
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
      - "51821:51821/tcp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wg show | grep -q interface"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
      - DAC_OVERRIDE

  # ---------------------------------------------------------------------------
  # autoheal - Restart containers Docker has marked unhealthy
  # ---------------------------------------------------------------------------
  # Reads container health through the socket-proxy (list containers and POST
  # restart, nothing else) and restarts any container in `unhealthy` state.
  # Catches flaresolverr's Chromium failure loops, NPM config corruption, and
  # any future health regression without operator intervention.
  # AUTOHEAL_START_PERIOD=0 means it honours each container's own start_period.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    profiles:
      - autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=0
      - DOCKER_SOCK=tcp://127.0.0.1:23750
      - TZ=${TZ}
    depends_on:
      socket-proxy:
        condition: service_healthy
    # Host network: the proxy listens on host loopback only (see socket-proxy),
    # and autoheal needs no other service, so it stays off the mediastack bridge.
    network_mode: host
    restart: unless-stopped
    # SIGINT, not the default SIGTERM: the image traps SIGTERM with `kill $$`,
    # which re-raises the signal inside its own handler and crashes busybox ash
    # (Exited 139, SIGSEGV) on every stop, reboot and Docker restart. The
    # entrypoint has no SIGINT trap, so the shell ends cleanly with 130.
    stop_signal: SIGINT
    # SIGINT waits for the in-flight restart call before the shell exits. A heal
    # is a `docker restart` (restart timeout: the target's own stop_grace_period,
    # 10 s by default, plus its start), and autoheal's AUTOHEAL_DEFAULT_STOP_TIMEOUT
    # is 10 s. The 10 s default kill hit mid-heal (Exited 137), so allow one full
    # heal: 10 s stop + start + margin.
    stop_grace_period: 60s
    security_opt: *default-security-opt
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # socket-proxy - Filtered Docker API for beszel-agent and autoheal
  # ---------------------------------------------------------------------------
  # Replaces the raw /var/run/docker.sock mount in beszel-agent and autoheal.
  # wollomatic/socket-proxy is deny-by-default with a Go-regexp allowlist per
  # HTTP method (https://github.com/wollomatic/socket-proxy#readme). It
  # matches the decoded request path, ignores the query, and wraps every
  # pattern as ^...$. That wrapper is why no pattern below may use a top-level
  # "|": "^a|b$" would leave both branches half-anchored. One flag per path
  # (repeatable since 1.12) keeps each pattern whole.
  #
  # Allowed (the consumers' calls, read from their source):
  #   GET  /containers/json            beszel-agent and autoheal list containers
  #   GET  /containers/<id>/stats      beszel-agent per-container stats
  #   GET  /version, /info             beszel-agent engine check and host summary
  #   POST /containers/<id>/restart    autoheal's restart
  # <id> is 12 to 64 lowercase hex characters (beszel-agent sends the short ID,
  # autoheal the full one), so a container name or any path trick fails to
  # match. Everything else is denied: inspect (GET /containers/<id>/json,
  # which returns each container's Env and so MediaStack secrets), attach,
  # logs, stop, kill, exec, create, images, events. Beszel's per-container
  # info and logs views, which need inspect and logs, therefore do not work.
  #
  # Host network, loopback only: -listenip=127.0.0.1 is the listener and
  # -allowfrom=127.0.0.1/32 the client filter. No Docker network carries the
  # proxy, so no container on the mediastack bridge can reach it, not even
  # through the bridge gateway address. 23750 avoids dockerd's 2375/2376 and
  # Swarm's 2377, sits below Linux's ephemeral range (32768-60999), and appears
  # nowhere else in this stack. -allowhealthcheck adds a second loopback-only
  # listener, 127.0.0.1:55555, that answers HEAD /health from the image's
  # ./healthcheck binary; the image fixes that port. The watchdog stops the
  # proxy when the socket vanishes (a Docker engine restart), so restart:
  # unless-stopped brings it back.
  #
  # Root, not the image's 65534: the Docker socket is root-owned with the
  # docker group, and the group ID differs per host. Root owns the socket, so
  # it needs no capability for it, and every capability is dropped.
  # ":ro" limits the bind mount, not the Docker API, so the proxy is the filter.
  socket-proxy:
    image: wollomatic/socket-proxy:1
    container_name: socket-proxy
    network_mode: host
    user: "0:0"
    command:
      - -listenip=127.0.0.1
      - -proxyport=23750
      - -allowfrom=127.0.0.1/32
      - -allowGET=/containers/json
      - -allowGET=/containers/[0-9a-f]{12,64}/stats
      - -allowGET=/version
      - -allowGET=/info
      - -allowPOST=/containers/[0-9a-f]{12,64}/restart
      - -allowhealthcheck
      - -watchdoginterval=30
      - -stoponwatchdog
      - -loglevel=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    security_opt: *default-security-opt
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/healthcheck"]
      # Short interval: beszel-agent and autoheal wait for this to pass, and
      # Docker runs the first check one interval after start.
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
