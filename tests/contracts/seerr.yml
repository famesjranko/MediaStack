service: seerr
base_path: /api/v1
auth: {type: cookie, name: connect.sid}
endpoints:
  - {id: readiness, method: GET, base_path: /, path: /, expect: [200, 301, 302, 303, 307, 308], sends: [], reads: [], callers: [scripts/configure.sh]}
  - {id: public-settings, method: GET, path: /settings/public, sends: [], reads: [mediaServerType, initialized], callers: [scripts/services/seerr/main.sh]}
  - {id: jellyfin-auth, method: POST, path: /auth/jellyfin, sends: [username, password, hostname, port, useSsl, urlBase, serverType], reads: [], callers: [scripts/services/seerr/main.sh]}
  - {id: local-auth-probe, method: POST, path: /auth/local, expect: [403], sends: [email, password], reads: [], callers: [scripts/lib/health.sh]}
  - {id: current-user, method: GET, path: /auth/me, sends: [], reads: [id, email], callers: [scripts/services/seerr/main.sh]}
  - {id: jellyfin-settings, method: GET, path: /settings/jellyfin, sends: [], reads: [apiKey], callers: [scripts/services/seerr/main.sh]}
  - {id: jellyfin-library-sync, method: POST, path: /settings/jellyfin/library/sync, sends: [], reads: [id], callers: [scripts/services/seerr/main.sh]}
  - {id: jellyfin-library-enable, method: PUT, path: "/settings/jellyfin/library/{id}", sends: [enabled], reads: [], callers: [scripts/services/seerr/main.sh]}
  - {id: initialization, method: POST, path: /settings/initialize, sends: [], reads: [], callers: [scripts/services/seerr/main.sh]}
  # `defaultQuotas` is read (movie/tv quotaLimit + quotaDays) by reconcile_seerr_quotas in
  # scripts/services/seerr/quotas.sh, which fails closed when it is absent. Seerr always
  # returns it, even on a fresh install.
  - {id: main-settings-get, method: GET, path: /settings/main, sends: [], reads: [apiKey, defaultPermissions, defaultQuotas], callers: [scripts/services/seerr/main.sh, scripts/services/seerr/quotas.sh]}
  - {id: main-settings-update, method: POST, path: /settings/main, sends: [defaultPermissions, defaultQuotas], reads: [], callers: [scripts/services/seerr/quotas.sh]}
  - {id: network-settings-get, method: GET, path: /settings/network, sends: [], reads: [trustProxy], callers: [scripts/services/seerr/main.sh]}
  - {id: network-settings-update, method: POST, path: /settings/network, sends: [trustProxy], reads: [], callers: [scripts/services/seerr/main.sh]}
  - {id: sonarr-settings-get, method: GET, path: /settings/sonarr, sends: [], reads: [], callers: [scripts/services/seerr/arr-connect.sh]}
  - {id: radarr-settings-get, method: GET, path: /settings/radarr, sends: [], reads: [], callers: [scripts/services/seerr/arr-connect.sh]}
  - {id: sonarr-settings-update, method: POST, path: /settings/sonarr, sends: [name, hostname, port, useSsl, urlBase, serverType, apiKey, activeProfileId, activeProfileName, activeDirectory, is4k, isDefault, syncEnabled, preventSearch, activeLanguageProfileId, enableSeasonFolders, minimumAvailability], reads: [], callers: [scripts/services/seerr/arr-connect.sh]}
  - {id: radarr-settings-update, method: POST, path: /settings/radarr, sends: [name, hostname, port, useSsl, urlBase, serverType, apiKey, activeProfileId, activeProfileName, activeDirectory, is4k, isDefault, syncEnabled, preventSearch, activeLanguageProfileId, enableSeasonFolders, minimumAvailability], reads: [], callers: [scripts/services/seerr/arr-connect.sh]}
