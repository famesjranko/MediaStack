service: wireguard
base_path: /
auth: {type: basic}
endpoints:
  - {id: readiness, method: GET, path: /, expect: [200, 301, 302, 303, 307, 308], sends: [], reads: [], callers: [scripts/configure.sh]}
  - {id: client-list, method: GET, path: /api/client, sends: [], reads: [id, name], callers: [scripts/services/wireguard/main.sh]}
  - {id: client-get, method: GET, path: "/api/client/{id}", sends: [], reads: [id, name, firewallIps], callers: [scripts/services/wireguard/main.sh]}
  # Mutations can return an empty body. The configurator verifies persisted state with GET.
  - {id: client-create, method: POST, path: /api/client, sends: [name, expiresAt], reads: [], callers: [scripts/services/wireguard/main.sh]}
  - {id: client-update, method: POST, path: "/api/client/{id}", sends: [firewallIps], reads: [], callers: [scripts/services/wireguard/main.sh]}
  - {id: admin-interface-get, method: GET, path: /api/admin/interface, sends: [], reads: [firewallEnabled], callers: [scripts/services/wireguard/main.sh]}
  - {id: admin-interface-update, method: POST, path: /api/admin/interface, sends: [firewallEnabled], reads: [], callers: [scripts/services/wireguard/main.sh]}
