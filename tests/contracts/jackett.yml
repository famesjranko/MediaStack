service: jackett
base_path: /
auth: {type: query, name: apikey}
endpoints:
  - {id: readiness, method: GET, path: /, expect: [200, 301, 302, 303, 307, 308], sends: [], reads: [], callers: [scripts/configure.sh]}
  - {id: dashboard-get, method: GET, path: /UI/Dashboard, expect: [200, 302], sends: [], reads: [], callers: [scripts/services/jackett/main.sh]}
  - {id: dashboard-login, method: POST, path: /UI/Dashboard, expect: [302], sends: [], reads: [], callers: [scripts/services/jackett/main.sh]}
  - {id: server-config-get, method: GET, path: /api/v2.0/server/config, sends: [], reads: [api_key], callers: [scripts/services/jackett/main.sh]}
  - {id: server-config-update, method: POST, path: /api/v2.0/server/config, sends: [api_key, flaresolverrurl, flaresolverr_maxtimeout], reads: [], callers: [scripts/services/jackett/main.sh]}
  - {id: indexer-list, method: GET, path: /api/v2.0/indexers, sends: [], reads: [id, configured], callers: [scripts/services/jackett/main.sh]}
  - {id: indexer-config-get, method: GET, path: "/api/v2.0/indexers/{key}/config", sends: [], reads: [id], callers: [scripts/services/jackett/main.sh]}
  - {id: indexer-config-update, method: POST, path: "/api/v2.0/indexers/{key}/config", sends: [config], reads: [], callers: [scripts/services/jackett/main.sh]}
  - {id: torznab-caps, method: GET, path: "/api/v2.0/indexers/{key}/results/torznab/", sends: [apikey, t], reads: [], callers: [scripts/lib/arr/indexers.sh]}
  - {id: admin-password-update, method: POST, path: /api/v2.0/server/adminpassword, sends: [password], reads: [], callers: [scripts/services/jackett/main.sh]}
