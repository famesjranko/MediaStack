name: Image Drift Alert

# Weekly maintainer tripwire. It compares compose image tags with the accepted
# baseline in docs/operations/image-digests.lock and keeps one issue in this
# repository current until the baseline matches upstream again. Accept changed
# digests only after the preflight documented in docs/operations/upgrades.md.

# GitHub silently disables scheduled workflows in a repository with no commit
# activity for 60 days; if this tripwire matters during a quiet stretch, run it
# by hand (workflow_dispatch) or re-enable it from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      preflight:
        description: Run disposable image compatibility jobs instead of the alert
        type: boolean
        default: false
      services:
        description: Optional comma-separated subset of drifted services
        type: string
        default: ""
      publish:
        description: Propose a tested digest PR (default branch only)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  image-drift:
    if: ${{ !inputs.preflight }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Check remote image digests
        id: check
        run: |
          rc=0
          python3 scripts/image_drift.py --require-previous >drift.md 2>drift.err || rc=$?
          # image_drift.py exits 2 for drift, but argparse also exits 2 on a
          # bad flag — with an empty report and the complaint on stderr. Remap
          # that to an error so a workflow typo fails red instead of filing an
          # empty drift issue.
          if [ "$rc" -eq 2 ] && [ ! -s drift.md ]; then
            echo "::error::rc=2 with an empty drift report — usage error, not drift; see drift.err below."
            rc=1
          fi
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          echo "image-drift exit code: $rc"
          cat drift.md || true
          cat drift.err || true

      - name: Open or update drift issue
        if: steps.check.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Tolerate only the label already existing; any other failure (rate
          # limit, permissions) surfaces here rather than as a confusing
          # gh issue create --label error below.
          if ! label_err=$(gh label create image-drift --color FBCA04 \
            --description "Upstream image moved past the tested baseline" 2>&1); then
            case "$label_err" in
              *already?exists*) ;;
              *)
                echo "$label_err" >&2
                exit 1
                ;;
            esac
          fi
          title="Image drift: upstream images moved past the tested baseline"
          {
            cat drift.md
            printf '\n---\n_Filed by [Image Drift Alert](%s) on %s. You do not need to accept every drifted row at once — see the selective `--accept-services` flow in `docs/operations/upgrades.md`. This issue auto-closes once the lock matches upstream._\n' \
              "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >body.md
          existing=$(gh issue list --label image-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            gh issue comment "$existing" \
              --body "Drift re-detected $(date -u '+%Y-%m-%d %H:%M UTC') — body refreshed. [Run]($RUN_URL)"
            echo "Updated existing drift issue #$existing"
          else
            url=$(gh issue create --title "$title" --body-file body.md --label image-drift)
            echo "Opened drift issue: $url"
          fi

      - name: Close resolved drift issue
        if: steps.check.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          nums=$(gh issue list --label image-drift --state open --json number --jq '.[].number')
          for n in $nums; do
            gh issue comment "$n" \
              --body "Baseline matches upstream as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$n"
            echo "Closed resolved drift issue #$n"
          done

      - name: Fail on check error
        if: steps.check.outputs.rc != '0' && steps.check.outputs.rc != '2'
        run: |
          echo "::error::image-drift check errored (rc=${{ steps.check.outputs.rc }}); see the check step log."
          exit 1

  preflight-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Freeze source, candidates, companions, and fixture images
        id: plan
        env:
          SELECTED_SERVICES: ${{ inputs.services }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tests/hosted_preflight.py prepare --run "$RUN_ID" \
            --services "$SELECTED_SERVICES" --output /tmp/preflight-plan >>"$GITHUB_OUTPUT"
          cat /tmp/preflight-plan/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-plan
          path: /tmp/preflight-plan/
          if-no-files-found: error
          retention-days: 14

  preflight-images:
    needs: preflight-plan
    if: needs.preflight-plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Run the frozen candidate combination without publishing credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 tests/hosted_preflight.py run --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --scenario "$SCENARIO" --output "/tmp/result-$SCENARIO"
      - name: Preserve evidence before the disposable VM is released
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-${{ matrix.scenario }}
          path: /tmp/result-${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 14

  preflight-verify:
    needs: [preflight-plan, preflight-images]
    if: always() && needs.preflight-plan.result == 'success' && needs.preflight-plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-*
          path: /tmp/preflight-results
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Validate artifacts and prepare a selective lock update
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
        run: |
          python3 tests/hosted_preflight.py verify --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --results /tmp/preflight-results --output /tmp/preflight-accepted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-accepted
          path: /tmp/preflight-accepted/
          if-no-files-found: error
          retention-days: 14

  preflight-publish:
    needs: [preflight-plan, preflight-verify]
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-*
          path: /tmp/preflight-results
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Revalidate original data using trusted source code
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
        run: |
          python3 tests/hosted_preflight.py verify --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --results /tmp/preflight-results --output /tmp/preflight-accepted
      - name: Open a reviewed digest PR without merging
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)
          test "$latest" = "$SOURCE_SHA" || { echo 'Default branch advanced; rerun the preflight.' >&2; exit 1; }
          cp /tmp/preflight-accepted/image-digests.lock docs/operations/image-digests.lock
          python3 scripts/image_drift.py --write-readme-badges README.md
          if git diff --quiet -- docs/operations/image-digests.lock README.md; then exit 0; fi
          branch="chore/tested-images-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git add docs/operations/image-digests.lock README.md
          git -c user.name='Andrew McDonald' -c user.email=andrewmcdonald42@gmail.com \
            commit -m 'chore: refresh tested Stable image digests'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title 'chore: refresh tested Stable image digests' \
            --body-file /tmp/preflight-accepted/body.md
