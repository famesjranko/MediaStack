name: Image Drift Alert

# Weekly maintainer tripwire. It compares compose image tags with the accepted
# baseline in docs/operations/image-digests.lock and keeps one issue in this
# repository current until the baseline matches upstream again. Accept changed
# digests only after the preflight documented in docs/operations/upgrades.md.

# GitHub silently disables scheduled workflows in a repository with no commit
# activity for 60 days; if this tripwire matters during a quiet stretch, run it
# by hand (workflow_dispatch) or re-enable it from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      preflight:
        description: Run disposable image compatibility jobs instead of the alert
        type: boolean
        default: false
      services:
        description: Optional comma-separated subset of drifted services
        type: string
        default: ""
      publish:
        description: Propose a tested digest PR (default branch only)
        type: boolean
        default: false

# Every job declares its own permissions; none inherits these.
permissions:
  contents: read

jobs:
  image-drift:
    if: ${{ !inputs.preflight }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Check remote image digests
        id: check
        run: |
          rc=0
          python3 scripts/image_drift.py --require-previous >drift.md 2>drift.err || rc=$?
          # image_drift.py exits 2 for drift, but argparse also exits 2 on a
          # bad flag — with an empty report and the complaint on stderr. Remap
          # that to an error so a workflow typo fails red instead of filing an
          # empty drift issue.
          if [ "$rc" -eq 2 ] && [ ! -s drift.md ]; then
            echo "::error::rc=2 with an empty drift report — usage error, not drift; see drift.err below."
            rc=1
          fi
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          echo "image-drift exit code: $rc"
          cat drift.md || true
          cat drift.err || true

      - name: Open or update drift issue
        if: steps.check.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Tolerate only the label already existing; any other failure (rate
          # limit, permissions) surfaces here rather than as a confusing
          # gh issue create --label error below.
          if ! label_err=$(gh label create image-drift --color FBCA04 \
            --description "Upstream image moved past the tested baseline" 2>&1); then
            case "$label_err" in
              *already?exists*) ;;
              *)
                echo "$label_err" >&2
                exit 1
                ;;
            esac
          fi
          title="Image drift: upstream images moved past the tested baseline"
          {
            cat drift.md
            printf '\n---\n_Filed by [Image Drift Alert](%s) on %s. You do not need to accept every drifted row at once — see the selective `--accept-services` flow in `docs/operations/upgrades.md`. This issue auto-closes once the lock matches upstream._\n' \
              "$RUN_URL" "$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >body.md
          existing=$(gh issue list --label image-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            gh issue comment "$existing" \
              --body "Drift re-detected $(date -u '+%Y-%m-%d %H:%M UTC') — body refreshed. [Run]($RUN_URL)"
            echo "Updated existing drift issue #$existing"
          else
            url=$(gh issue create --title "$title" --body-file body.md --label image-drift)
            echo "Opened drift issue: $url"
          fi

      - name: Close resolved drift issue
        if: steps.check.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          nums=$(gh issue list --label image-drift --state open --json number --jq '.[].number')
          for n in $nums; do
            gh issue comment "$n" \
              --body "Baseline matches upstream as of $(date -u '+%Y-%m-%d %H:%M UTC'). Closing."
            gh issue close "$n"
            echo "Closed resolved drift issue #$n"
          done

      - name: Fail on check error
        if: steps.check.outputs.rc != '0' && steps.check.outputs.rc != '2'
        run: |
          echo "::error::image-drift check errored (rc=${{ steps.check.outputs.rc }}); see the check step log."
          exit 1

  preflight-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Freeze source, candidates, companions, and fixture images
        id: plan
        env:
          SELECTED_SERVICES: ${{ inputs.services }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tests/hosted_preflight.py prepare --run "$RUN_ID" \
            --services "$SELECTED_SERVICES" --output /tmp/preflight-plan >>"$GITHUB_OUTPUT"
          cat /tmp/preflight-plan/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-plan
          path: /tmp/preflight-plan/
          if-no-files-found: error
          retention-days: 14

  # Phase 1: each selected candidate runs alone with the accepted companions.
  preflight-isolate:
    needs: preflight-plan
    if: needs.preflight-plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Run one candidate with accepted companions, without publishing credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
          JOB_ID: ${{ matrix.job }}
        run: |
          python3 tests/hosted_preflight.py run --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --job "$JOB_ID" --output "/tmp/result-$JOB_ID"
      - name: Preserve evidence before the disposable VM is released
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-${{ matrix.job }}
          path: /tmp/result-${{ matrix.job }}/
          if-no-files-found: error
          retention-days: 14

  # Reads phase-1 artifacts only as data. It freezes the phase-2 combination and
  # passes that plan's hash through job outputs, like the planner.
  preflight-select:
    needs: [preflight-plan, preflight-isolate]
    if: ${{ !cancelled() && needs.preflight-plan.result == 'success' && needs.preflight-plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      plan_hash: ${{ steps.select.outputs.plan_hash }}
      has_work: ${{ steps.select.outputs.has_work }}
      authority: ${{ steps.select.outputs.authority }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-p1-*
          path: /tmp/preflight-results
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Freeze the combination of candidates that passed phase 1
        id: select
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
        run: |
          python3 tests/hosted_preflight.py select --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --results /tmp/preflight-results --output /tmp/preflight-selection >>"$GITHUB_OUTPUT"
          cat /tmp/preflight-selection/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-selection
          path: /tmp/preflight-selection/
          if-no-files-found: error
          retention-days: 14

  # Phase 2: the candidates that passed phase 1 run together. A single passing
  # candidate already ran as this exact combination, so phase 2 is skipped.
  preflight-combine:
    needs: [preflight-plan, preflight-select]
    if: ${{ !cancelled() && needs.preflight-select.result == 'success' && needs.preflight-select.outputs.has_work == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight-select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-selection
          path: /tmp/preflight-selection
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Run the frozen combination without publishing credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-select.outputs.plan_hash }}
          JOB_ID: ${{ matrix.job }}
        run: |
          python3 tests/hosted_preflight.py run --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-selection/plan.json \
            --job "$JOB_ID" --output "/tmp/result-$JOB_ID"
      - name: Preserve evidence before the disposable VM is released
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-${{ matrix.job }}
          path: /tmp/result-${{ matrix.job }}/
          if-no-files-found: error
          retention-days: 14

  preflight-verify:
    needs: [preflight-plan, preflight-select, preflight-combine]
    if: ${{ !cancelled() && needs.preflight-select.result == 'success' && (needs.preflight-select.outputs.authority == 'phase-1' || (needs.preflight-select.outputs.authority == 'phase-2' && needs.preflight-combine.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-selection
          path: /tmp/preflight-selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-p*
          path: /tmp/preflight-results
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Validate artifacts and prepare a selective lock update
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
          SELECTION_HASH: ${{ needs.preflight-select.outputs.plan_hash }}
        run: |
          python3 tests/hosted_preflight.py verify --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --selection-hash "$SELECTION_HASH" --selection /tmp/preflight-selection/plan.json \
            --results /tmp/preflight-results --output /tmp/preflight-accepted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preflight-accepted
          path: /tmp/preflight-accepted/
          if-no-files-found: error
          retention-days: 14

  # Owns one rolling PR on a bot-owned branch. It runs even when this run
  # accepted nothing, so that the report can name the PR it left unchanged.
  preflight-publish:
    needs: [preflight-plan, preflight-select, preflight-verify]
    if: ${{ !cancelled() && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.preflight-select.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: tested-digests-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      outcome: ${{ steps.decide.outputs.action }}
      pr: ${{ steps.publish.outputs.pr || steps.decide.outputs.pr }}
      reason: ${{ steps.decide.outputs.reason }}
    env:
      BRANCH: chore/tested-images
      LABEL: tested-digests
      TITLE: "chore: refresh tested Stable image digests"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-selection
          path: /tmp/preflight-selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.preflight-verify.result == 'success'
        with:
          pattern: result-p*
          path: /tmp/preflight-results
      - name: Revalidate original data using trusted source code
        if: needs.preflight-verify.result == 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
          SELECTION_HASH: ${{ needs.preflight-select.outputs.plan_hash }}
        run: |
          python3 tests/hosted_preflight.py verify --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --selection-hash "$SELECTION_HASH" --selection /tmp/preflight-selection/plan.json \
            --results /tmp/preflight-results --output /tmp/preflight-accepted
      - name: Read the rolling branch and its open PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -e /tmp/preflight-accepted/image-digests.lock ]; then
            latest=$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)
            test "$latest" = "$SOURCE_SHA" || { echo 'Default branch advanced; rerun the preflight.' >&2; exit 1; }
          fi
          mkdir /tmp/publish-facts
          gh api "repos/$GH_REPO/pulls?state=open&per_page=10&head=${GH_REPO%%/*}:$BRANCH" >/tmp/publish-facts/prs.json
          gh api "repos/$GH_REPO/pulls?state=closed&sort=updated&direction=desc&per_page=10&head=${GH_REPO%%/*}:$BRANCH" \
            >/tmp/publish-facts/closed.json
          refs=$(git ls-remote origin "refs/heads/$BRANCH")
          head=${refs%%[[:space:]]*}
          printf '%s\n' "$head" >/tmp/publish-facts/head
          if [ -n "$head" ]; then
            gh api "repos/$GH_REPO/compare/$DEFAULT_BRANCH...$head" >/tmp/publish-facts/compare.json
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$GH_REPO/contents/docs/operations/image-digests.lock?ref=$head" >/tmp/publish-facts/branch.lock
          fi
      - name: Decide the single change to the rolling digest PR
        id: decide
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
          SELECTION_HASH: ${{ needs.preflight-select.outputs.plan_hash }}
          VERIFIED: ${{ needs.preflight-verify.result }}
        run: |
          python3 tests/hosted_preflight.py decide --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --selection-hash "$SELECTION_HASH" --selection /tmp/preflight-selection/plan.json \
            --verified "$VERIFIED" --facts /tmp/publish-facts \
            --proposed /tmp/preflight-accepted/image-digests.lock >/tmp/publish-facts/decision
          cat /tmp/publish-facts/decision >>"$GITHUB_OUTPUT"
          cat /tmp/publish-facts/decision >>"$GITHUB_STEP_SUMMARY"
          if grep -qx 'action=refuse' /tmp/publish-facts/decision; then
            echo "::error::The rolling digest branch or PR is not publisher-owned; nothing changed."
            exit 1
          fi
      - name: Close the digest PR that this run refused, and delete its branch
        if: steps.decide.outputs.action == 'close'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.decide.outputs.pr }}
          LEASE: ${{ steps.decide.outputs.lease }}
          REASON: ${{ steps.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Closed by [image preflight](%s): %s. The next accepted run opens a new PR.\n' \
            "$RUN_URL" "$REASON" >/tmp/close.md
          gh pr comment "$PR" --body-file /tmp/close.md
          gh pr close "$PR"
          gh auth setup-git
          # Delete only the head the publisher read; otherwise the next run would
          # refuse a branch left by a closed PR.
          git push --force-with-lease="refs/heads/$BRANCH:$LEASE" origin ":refs/heads/$BRANCH"
      - name: Rebuild the rolling branch from the default branch and refresh its PR
        id: publish
        if: contains(fromJSON('["create","update","unchanged"]'), steps.decide.outputs.action)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTION: ${{ steps.decide.outputs.action }}
          PR: ${{ steps.decide.outputs.pr }}
          LEASE: ${{ steps.decide.outputs.lease }}
        run: |
          if ! label_err=$(gh label create "$LABEL" --color 0E8A16 \
            --description "Rolling PR with tested Stable image digests" 2>&1); then
            case "$label_err" in
              *already?exists*) ;;
              *)
                echo "$label_err" >&2
                exit 1
                ;;
            esac
          fi
          # An unchanged lock keeps the branch; only the PR description cites this run.
          if [ "$ACTION" != unchanged ]; then
            cp /tmp/preflight-accepted/image-digests.lock docs/operations/image-digests.lock
            python3 scripts/image_drift.py --write-readme-badges README.md
            git switch -c "$BRANCH"
            git add docs/operations/image-digests.lock README.md
            git -c user.name='Andrew McDonald' -c user.email=andrewmcdonald42@gmail.com \
              commit -m "$TITLE"
            gh auth setup-git
            # An empty lease requires that the branch does not exist yet.
            git push --force-with-lease="refs/heads/$BRANCH:$LEASE" origin "HEAD:refs/heads/$BRANCH"
          fi
          if [ "$ACTION" = create ]; then
            url=$(gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "$TITLE" \
              --body-file /tmp/preflight-accepted/body.md)
            PR=${url##*/}
          else
            gh api --method PATCH "repos/$GH_REPO/pulls/$PR" \
              -F body=@/tmp/preflight-accepted/body.md >/dev/null
          fi
          case "$PR" in '' | *[!0-9]*) echo "Unexpected PR reference: $PR" >&2 && exit 1 ;; esac
          gh api --method POST "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=$LABEL" >/dev/null
          echo "pr=$PR" >>"$GITHUB_OUTPUT"

  # Posts one status comment per run, also when the planner failed. It never
  # runs images or artifact code; the weekly alert keeps owning the issue body.
  preflight-report:
    needs: [preflight-plan, preflight-select, preflight-combine, preflight-verify, preflight-publish]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REF: ${{ github.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.preflight-plan.result == 'success'
        with:
          name: preflight-plan
          path: /tmp/preflight-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.preflight-select.result == 'success'
        with:
          name: preflight-selection
          path: /tmp/preflight-selection
      - name: Write the per-service status
        id: status
        if: needs.preflight-plan.result == 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PLAN_HASH: ${{ needs.preflight-plan.outputs.plan_hash }}
          SELECTION_HASH: ${{ needs.preflight-select.result == 'success' && needs.preflight-select.outputs.plan_hash || '' }}
          COMBINED: ${{ needs.preflight-combine.result }}
          VERIFIED: ${{ needs.preflight-verify.result }}
          PUBLISH_RESULT: ${{ needs.preflight-publish.result }}
          OUTCOME: ${{ needs.preflight-publish.outputs.outcome }}
          PR: ${{ needs.preflight-publish.outputs.pr }}
          REASON: ${{ needs.preflight-publish.outputs.reason }}
        run: |
          python3 tests/hosted_preflight.py report --run "$RUN_ID" --source "$SOURCE_SHA" \
            --hash "$PLAN_HASH" --plan /tmp/preflight-plan/plan.json \
            --selection-hash "$SELECTION_HASH" --selection /tmp/preflight-selection/plan.json \
            --combined "$COMBINED" --verified "$VERIFIED" --publish-result "$PUBLISH_RESULT" \
            --outcome "$OUTCOME" --pr "$PR" --reason "$REASON" --run-url "$RUN_URL" \
            --ref "$REF" --default-branch "$DEFAULT_BRANCH" >/tmp/preflight-report.md
      - name: Write a failure notice when no status is available
        if: ${{ !cancelled() && steps.status.outcome != 'success' }}
        env:
          PLAN_RESULT: ${{ needs.preflight-plan.result }}
        run: |
          python3 tests/hosted_preflight.py abort --plan-result "$PLAN_RESULT" \
            --run-url "$RUN_URL" --ref "$REF" --default-branch "$DEFAULT_BRANCH" \
            >/tmp/preflight-report.md
      - name: Comment on the open drift issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat /tmp/preflight-report.md >>"$GITHUB_STEP_SUMMARY"
          issue=$(gh issue list --label image-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file /tmp/preflight-report.md
          else
            echo 'No open image-drift issue; the report is in the step summary only.'
          fi
