name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml ripgrep locales
          # Generate a non-C-collation UTF-8 locale so the ui-box-alignment
          # locale guard actually exercises the LC_ALL=C path (otherwise it
          # skips and the regression could slip through).
          sudo locale-gen en_US.UTF-8 || true

      - name: Secret and private-file guard
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|\.envrc|tests/\.env\.gcp|private(/|$)|docs/plans(/|$)|\.planning(/|$)|\.tmp(/|$)|CONTEXT\.md$|tests/.*-plan\.md$)'
          if git ls-files | grep -E "$forbidden" | grep -Ev '(^|/)(\.env\.example|\.env\.gcp\.example)$'; then
            echo "Forbidden private or planning file is tracked"
            exit 1
          fi
          if git ls-files -z | \
            grep -zEv '^(\.env\.example$|tests/\.env\.gcp\.example$)' | \
            xargs -0 rg -n \
              -e '-----BEGIN (RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}|ya29\.[0-9A-Za-z_-]+|AKIA[0-9A-Z]{16}|gh[pousr]_[0-9A-Za-z_]{36,}|xox[baprs]-[0-9A-Za-z-]+|client_secret[[:space:]]*[:=][[:space:]]*["'\'']?[^"'\''[:space:]]+|private_key[[:space:]]*[:=][[:space:]]*["'\'']?[^"'\''[:space:]]+'; then
            echo "Potential secret pattern found"
            exit 1
          fi

      - name: Shell syntax
        run: |
          set -euo pipefail
          git ls-files '*.sh' mediastack setup.sh | xargs bash -n

      - name: Shellcheck (lint gate)
        run: |
          set -euo pipefail
          # Regression gate: fail on any shellcheck WARNING or ERROR. Repo-specific
          # flags and curated suppressions live in .shellcheckrc; tests/lint.sh pins
          # the engine (0.11.0). ubuntu-latest's native shellcheck is older than the
          # pin, so lint.sh runs the pinned koalaman/shellcheck docker image —
          # byte-for-byte identical to the local gate.
          ./tests/lint.sh --severity=warning

      - name: Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/image-drift.py \
            scripts/setup/wizard_apply.py \
            scripts/lib/arr/render/*.py \
            tests/lib/wizard_pty.py

      - name: Config and compose validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import yaml

          for path in ["config.yml", *pathlib.Path(".github/workflows").glob("*.yml")]:
              yaml.safe_load(pathlib.Path(path).read_text())
          PY
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile proxy config --quiet
          docker compose --profile remote config --quiet
          docker compose --profile subtitles config --quiet
          docker compose --profile autoheal config --quiet
          docker compose --profile proxy --profile remote --profile subtitles --profile autoheal config --quiet
          rm -f .env

      - name: Run unit tests
        run: |
          set -uo pipefail
          # Run the whole host unit suite (no Docker), not a curated subset, so
          # every shipped unit test is actually exercised here. The private repo's
          # PR gate runs the same loop; the only difference is the maintainer-only
          # tests that never sync to this repo.
          fail=0
          for f in tests/unit/*.sh; do
            name=$(basename "$f" .sh)
            echo "::group::unit: $name"
            # Per-test timeout so a stuck test (e.g. a non-TTY re-prompt loop that
            # never reaches EOF) fails fast instead of hanging the job.
            if timeout 300 bash "$f"; then
              echo "::endgroup::"
            else
              rc=$?
              echo "::endgroup::"
              if (( rc == 124 )); then
                echo "::error title=unit timed out::$name (exceeded 300s — likely a hang)"
              else
                echo "::error title=unit failed::$name"
              fi
              fail=1
            fi
          done
          exit "$fail"

  wizard-ui:
    name: Wizard PTY scenarios (DinD, no service image pulls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Run wizard-ui scenarios (stubbed Docker, MS_TEST_SKIP_PRELOAD=1)
        run: |
          set -uo pipefail
          scenarios=$(ls tests/scenarios/wizard-ui-*.sh \
            | xargs -n1 basename | sed 's/\.sh$//' | tr '\n' ' ')
          echo "Running: $scenarios"
          MS_TEST_SKIP_PRELOAD=1 bash tests/run.sh $scenarios
