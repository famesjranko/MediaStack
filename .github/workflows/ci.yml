name: CI

# Each job name below is the required-status-check context GitHub reports.
# Renaming one leaves branch protection requiring a context that no longer
# reports, which is unmergeable with no admin bypass.

on:
  push:
    branches: [main]
  pull_request:
  # Manual diagnostics do not satisfy PR rulesets. A maintainer must approve
  # the pull_request run that GitHub withholds for a GITHUB_TOKEN-created PR.
  workflow_dispatch:

# Cancel a superseded run for the same ref, including main: a newer push
# obsoletes an in-flight check on the commit it replaced either way, and
# there is no separate deploy job here that a cancelled run could leave
# half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Baseline is read-only; no job in this workflow needs to write anything
# (no PR comments, no check-run API calls, no pushes), so none raises it.
permissions:
  contents: read

# No job restores an Actions cache. The image preflight runs privileged DinD on
# main, and a runner escape there could forge a main-scoped cache entry that
# every branch restores. actions/cache extracts with tar -P, so a forged entry
# can overwrite any workspace file, including the scripts that verify tool
# hashes. Each job fetches and sha256-verifies its pinned tools instead.
# tests/unit/workflow-caches.sh enforces this.

jobs:
  # Keep engine failures attributable to lint. The runner analyses one root
  # per process, and the dispatchers bound their imports, rather than relying
  # on a larger runner to absorb a whole-project source-analysis heap.
  lint-shellcheck:
    name: lint-shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The line-cap and naming ratchets baseline on the merge-base with
          # main; a depth-1 clone has no main, and the gates fail closed on it.
          fetch-depth: 0
      # tests/lint.sh fetches and sha256-verifies the pinned binary. The
      # runner's native shellcheck is older and fails the version gate, so
      # without this step the sweep pays a docker pull instead.
      - name: Install the shellcheck pin
        run: ./tests/lint.sh install
      - name: ShellCheck sweep
        run: ./tests/check.sh lint
      - name: Shell file line cap
        run: ./tests/check.sh line-cap
      - name: Filename casing
        run: ./tests/check.sh naming
      - name: Structure
        run: ./tests/check.sh structure
      - name: Dead code
        run: ./tests/check.sh dead-code

  # The pinned shfmt (tools.toml [shfmt]) over every tracked shell file.
  # tests/format.sh fetches and sha256-verifies the binary itself.
  format-shfmt:
    name: format-shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: tests/check.sh shfmt
        run: ./tests/check.sh shfmt

  # The pinned ruff (tools.toml [ruff]): lint, then format --check. Retried on
  # the same PyPI-transience grounds as type-mypy below.
  lint-ruff:
    name: lint-ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The C901 ratchet baselines on the merge-base with main; a depth-1
          # clone has no main, and the gate fails closed on it.
          fetch-depth: 0
      # setup-uv caches by default on hosted runners; see the no-cache note
      # at the top of this file.
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: false
      # The retry wraps ONLY the download-only warm-up, so PyPI transience is
      # absorbed here while a genuine lint failure in the check step below runs
      # exactly once and reads as exactly what it is.
      - name: Warm the pinned python tools (retried)
        run: |
          for attempt in 1 2 3; do
            ./tests/check.sh warm-python && exit 0
            echo "warm-python attempt $attempt failed — retrying" >&2
            sleep 5
          done
          exit 1
      - name: ruff (tools.toml [ruff] pin)
        run: ./tests/check.sh ruff

  # The pinned gitleaks (tools.toml [gitleaks]) over the working tree,
  # reconciled against tests/secret-scan.expected. The history scan is not run
  # here: it re-reads every commit, so a declared benign finding is reported
  # once per revision of its file and any edit to one turns CI red. Run
  # ./tests/check.sh secrets-history before a push that publishes new history.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: tests/check.sh secrets
        run: ./tests/check.sh secrets

  # Split from lint-shellcheck for the same attribution reason.
  type-mypy:
    name: type-mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # setup-uv is commit-pinned and installs an exact uv version. Its
      # default cache stays off; see the no-cache note at the top of this file.
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: false
      # Same shape as lint-ruff: retry only the download, run the check once.
      - name: Warm the pinned python tools (retried)
        run: |
          for attempt in 1 2 3; do
            ./tests/check.sh warm-python && exit 0
            echo "warm-python attempt $attempt failed — retrying" >&2
            sleep 5
          done
          exit 1
      - name: mypy (tools.toml [mypy] pin)
        run: ./tests/check.sh mypy

  # tests/unit.sh is the canonical host tier: shell syntax, python bytecode,
  # compose render, and every tests/unit/*.sh — including
  # repository-safety.sh (secret/private-file guard + workflow and config
  # YAML validity, via tests/lib/repo_guard.py) and secret-scan.sh (the
  # formal gitleaks scan). Its internal shellcheck (tier 2) and mypy (tier 4)
  # reruns are skipped here via MS_UNIT_SKIP_*: lint-shellcheck and
  # type-mypy above already cover those stages and this job is gated on both
  # (needs:), so skipping does not remove coverage — it removes the double
  # payment. tests/unit.sh reports a skipped tier as SKIP, never OK.
  unit-host:
    name: unit-host
    needs: [lint-shellcheck, type-mypy]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MS_UNIT_SKIP_SHELLCHECK: "1"
      MS_UNIT_SKIP_MYPY: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml locales
          # Generate a non-C-collation UTF-8 locale so the ui-box-alignment
          # locale guard actually exercises the LC_ALL=C path (otherwise it
          # skips and the regression could slip through).
          sudo locale-gen en_US.UTF-8 || true

      - name: tests/check.sh unit
        run: ./tests/check.sh unit

  # Unchanged in behavior from the previous workflow: the image-free wizard
  # scenario set (stubbed Docker, MS_TEST_SKIP_PRELOAD=1), no service image
  # pulls, no live host. Gated behind the two cheap jobs so a broken PR does
  # not also burn DinD minutes, but kept independent of unit-host so its
  # runtime does not queue behind that job's slower tier.
  wizard-ui:
    name: wizard-ui
    needs: [lint-shellcheck, type-mypy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: tests/check.sh wizard
        run: ./tests/check.sh wizard
