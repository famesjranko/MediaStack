name: CI — Fast Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml ripgrep locales
          # Generate a non-C-collation UTF-8 locale so the ui-box-alignment
          # locale guard actually exercises the LC_ALL=C path (otherwise it
          # skips and the regression could slip through).
          sudo locale-gen en_US.UTF-8 || true

      - name: Secret and private-file guard
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|\.envrc|tests/\.env\.gcp|private(/|$)|docs/plans(/|$)|\.planning(/|$)|\.tmp(/|$)|CONTEXT\.md$|tests/.*-plan\.md$)'
          if git ls-files | grep -E "$forbidden" | grep -Ev '(^|/)(\.env\.example|\.env\.gcp\.example)$'; then
            echo "Forbidden private or planning file is tracked"
            exit 1
          fi
          if git ls-files -z | \
            grep -zEv '^(\.env\.example$|tests/\.env\.gcp\.example$)' | \
            xargs -0 rg -n \
              -e '-----BEGIN (RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}|ya29\.[0-9A-Za-z_-]+|AKIA[0-9A-Z]{16}|gh[pousr]_[0-9A-Za-z_]{36,}|xox[baprs]-[0-9A-Za-z-]+|client_secret[[:space:]]*[:=][[:space:]]*["'\'']?[^"'\''[:space:]]+|private_key[[:space:]]*[:=][[:space:]]*["'\'']?[^"'\''[:space:]]+'; then
            echo "Potential secret pattern found"
            exit 1
          fi

      - name: Config and workflow YAML validation
        # Structural YAML lint for config.yml and the workflow files. Kept as a
        # distinct step because tests/unit.sh does not parse workflow YAML (its
        # compose render covers docker-compose.yml only).
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import yaml

          for path in ["config.yml", *pathlib.Path(".github/workflows").glob("*.yml")]:
              yaml.safe_load(pathlib.Path(path).read_text())
          PY

      - name: Static validation + host unit tests
        # Shell syntax, shellcheck, py_compile, compose render, and the host unit
        # suite, behind one SSOT runner invoked identically by developers and CI.
        # See tests/unit.sh.
        run: ./tests/unit.sh

  wizard-ui:
    name: Wizard PTY scenarios (DinD, no service image pulls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Run image-free scenarios (stubbed Docker, MS_TEST_SKIP_PRELOAD=1)
        run: |
          set -uo pipefail
          # Image-free scenario set is the single source of truth in
          # tests/ci-scenarios.sh; fail the step if it can't produce a set rather
          # than let run.sh fall back to its image-pulling default.
          scenarios=$(bash tests/ci-scenarios.sh) || { echo "ci-scenarios.sh failed" >&2; exit 1; }
          [[ -n "${scenarios// }" ]] || { echo "ci-scenarios.sh produced no scenarios" >&2; exit 1; }
          echo "Running: $scenarios"
          MS_TEST_SKIP_PRELOAD=1 bash tests/run.sh $scenarios
