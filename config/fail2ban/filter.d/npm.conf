[Definition]
# NPM nginx access log format (v2.12+):
#   [$time] $cache $upstream_status $status - $method $scheme $host "$uri" [Client $addr] [Length …] …
# Sample: [20/Apr/2026:04:45:28 +0000] - 401 401 - GET https jellyfin.fresh.test "/Users" [Client 172.19.0.1] [Length 0] …
# Status appears BEFORE [Client], so match status first, then extract IP.
failregex = \s(401|403)\s.*\[Client <ADDR>\]
ignoreregex =
