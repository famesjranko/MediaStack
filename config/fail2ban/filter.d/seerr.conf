[Definition]
# Seerr logs every failed auth attempt at [warn]. Label is API (local-password sign-in, Plex,
# unimported-Jellyfin, and password-reset abuse) or Auth (Jellyfin-credential and admin-permission
# checks). The client IP is top-level ("ip":"...") for API lines and nested under "account" for
# Auth lines; either way it renders as "ip":"<addr>" in the JSON tail. Match any failed sign-in or
# password-reset attempt across all auth types. Verified against ghcr.io/seerr-team/seerr:latest
# server/routes/auth.ts via live fail2ban-regex (see tests/scenarios/fail2ban-drift.sh fixtures).
failregex = ^.*\[warn\]\[(API|Auth)\]: Failed (sign-in|password reset) attempt\b.*"ip":"<HOST>"
ignoreregex =
