[Definition]
# NPM nginx access log format (v2.12+):
#   [$time] $cache $upstream_status $status - $method $scheme $host "$uri" [Client $addr] [Length ...] ...
# Sample: [21/Apr/2026:12:00:01 +0000] - - 429 - GET https jellyfin.fresh.test "/api/health" [Client 203.0.113.5] [Length 0] ...
# Matches 429 (Too Many Requests) responses triggered by nginx limit_req.
failregex = \s429\s.*\[Client <ADDR>\]
ignoreregex =
