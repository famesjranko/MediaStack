# iptables-docker — iptables-allports with DOCKER-USER chain wait.
#
# Docker creates the DOCKER-USER chain when its network driver initializes.
# On reboot, fail2ban can start before Docker's networking is ready, so the
# actionstart that inserts jump rules into DOCKER-USER silently fails.
# This action waits up to 30s for DOCKER-USER to exist before proceeding.

[INCLUDES]

before = iptables-allports.conf

[Definition]

actionstart = for _i in $(seq 1 30); do
                <iptables> -L DOCKER-USER -n >/dev/null 2>&1 && break
                sleep 1
              done
              { <iptables> -C f2b-<name> -j <returntype> >/dev/null 2>&1; } || { <iptables> -N f2b-<name> || true; <iptables> -A f2b-<name> -j <returntype>; }
              <_ipt_add_rules>
