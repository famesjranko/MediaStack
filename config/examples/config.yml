# =============================================================================
# MediaStack Configuration
# =============================================================================
# Edit this file to change indexers, quality profiles, and service wiring.
# Then re-run: ./scripts/configure.sh
#
# This file is read by configure.sh - no need to touch docker-compose.yml
# or any bash scripts to make changes here.
# =============================================================================

# ---------------------------------------------------------------------------
# Jackett Indexers
# ---------------------------------------------------------------------------
# Public releases ship with no indexers enabled by default. Add only the
# indexers you are legally allowed to use, then re-run ./scripts/configure.sh.
# The setup wizard can enable an example public-tracker preset, and the same
# example lives at config/examples/public-indexers.yml.
#
# Format: id: description (description is for humans only)
indexers: []

# ---------------------------------------------------------------------------
# Torznab Categories
# ---------------------------------------------------------------------------
# Fallback category IDs — used only when Torznab caps auto-discovery fails.
# Normally, configure.sh queries each indexer's caps and selects categories
# automatically (split by app: movie cats for Radarr, TV cats for Sonarr).
# Standard IDs: https://wiki.servarr.com/sonarr/settings#indexers
categories:
  tv: "5000,5030,5040"          # TV, TV/SD, TV/HD
  movies: "2000,2030,2040"      # Movies, Movies/SD, Movies/HD

# ---------------------------------------------------------------------------
# Quality Profile
# ---------------------------------------------------------------------------
# Composed by the wizard as the chosen "{resolution} {size}" cell. The shipped
# default is "1080p Balanced" (1080p ceiling × balanced size envelope). Re-run
# the setup wizard to pick a different resolution or size.
# Enables every tier from the SD floor up to the 1080p ceiling, all sources; the
# cutoff (WEB 1080p group) stops upgrades once a 1080p WEB release is reached, so
# SD/720p are only fallbacks that upgrade away. See docs/reference/quality-bounds.md.
#
# Quality IDs reference (Sonarr; Radarr differs only at Bluray-480p=20):
#   SDTV=1, DVD=2, WEBDL-480p=8, WEBRip-480p=12, Bluray-480p=13
#   HDTV-720p=4, WEBDL-720p=5, Bluray-720p=6, WEBRip-720p=14
#   HDTV-1080p=9, WEBDL-1080p=3, Bluray-1080p=7, WEBRip-1080p=15
#   Remux-1080p=30 (deliberately excluded; see docs/reference/quality-bounds.md)
# Group IDs (for cutoff_id; Sonarr rejects sub-quality IDs as cutoffs):
#   WEB 480p=1000, WEB 720p=1001, WEB 1080p=1002, WEB 2160p=1003
quality_profile:
  name: "1080p Balanced"
  cutoff_id: 1002                # WEB 1080p group (contains WEBRip-1080p + WEBDL-1080p)
  upgrade_allowed: true
  sonarr_qualities:
    - 1    # SDTV
    - 2    # DVD
    - 8    # WEBDL-480p
    - 12   # WEBRip-480p
    - 13   # Bluray-480p
    - 4    # HDTV-720p
    - 5    # WEBDL-720p
    - 14   # WEBRip-720p
    - 6    # Bluray-720p
    - 9    # HDTV-1080p
    - 3    # WEBDL-1080p
    - 15   # WEBRip-1080p
    - 7    # Bluray-1080p
  radarr_qualities:              # No Remux; single grabs run 25-40 GB
    - 1    # SDTV
    - 2    # DVD
    - 8    # WEBDL-480p
    - 12   # WEBRip-480p
    - 20   # Bluray-480p
    - 4    # HDTV-720p
    - 5    # WEBDL-720p
    - 14   # WEBRip-720p
    - 6    # Bluray-720p
    - 9    # HDTV-1080p
    - 3    # WEBDL-1080p
    - 15   # WEBRip-1080p
    - 7    # Bluray-1080p

# ---------------------------------------------------------------------------
# Quality Definitions — per-tier file-size bounds
# ---------------------------------------------------------------------------
# Sonarr/Radarr ship with very loose defaults (e.g. HDTV-720p max ≈ 2000 MB/min
# for movies) so a single grab can land a 25 GB bloat rip or — at the other
# end — a 400 MB cam. These bounds tighten both extremes.
#
# Units: MB per minute (Sonarr per episode, Radarr per movie). The size envelope
# is the chosen size axis (here: Balanced "~4-8 GB/movie" at 1080p) — preferred
# sits mid-range of real-world sources, max is a sane ceiling, NOT the TRaSH
# max-quality baselines. The SD-floor rows accept small fallback releases that
# upgrade away toward the ceiling. See docs/reference/quality-bounds.md.
#
# Keys must match Sonarr/Radarr's internal quality names exactly (case-sensitive).
# Tiers not listed here keep their upstream defaults. To opt out entirely,
# delete or comment this whole section.
quality_definitions:
  sonarr:                                                     # ~1.1-3.4 GB/ep at 45 min
    SDTV:          { min: 1.0,  preferred: 8.0,  max: 25.0 }
    DVD:           { min: 2.0,  preferred: 12.0, max: 30.0 }
    WEBDL-480p:    { min: 1.0,  preferred: 8.0,  max: 25.0 }
    WEBRip-480p:   { min: 1.0,  preferred: 8.0,  max: 25.0 }
    Bluray-480p:   { min: 2.0,  preferred: 14.0, max: 35.0 }
    HDTV-720p:     { min: 12.0, preferred: 30.0, max: 50.0 }
    WEBDL-720p:    { min: 10.0, preferred: 30.0, max: 50.0 }
    WEBRip-720p:   { min: 10.0, preferred: 30.0, max: 50.0 }
    Bluray-720p:   { min: 18.0, preferred: 40.0, max: 60.0 }
    HDTV-1080p:    { min: 18.0, preferred: 45.0, max: 75.0 }
    WEBDL-1080p:   { min: 12.0, preferred: 45.0, max: 75.0 }
    WEBRip-1080p:  { min: 12.0, preferred: 45.0, max: 75.0 }
    Bluray-1080p:  { min: 30.0, preferred: 60.0, max: 90.0 }
  radarr:                                                     # ~3-9.9 GB/movie at 110 min
    SDTV:          { min: 1.0,  preferred: 8.0,  max: 25.0 }
    DVD:           { min: 2.0,  preferred: 12.0, max: 30.0 }
    WEBDL-480p:    { min: 1.0,  preferred: 8.0,  max: 25.0 }
    WEBRip-480p:   { min: 1.0,  preferred: 8.0,  max: 25.0 }
    Bluray-480p:   { min: 2.0,  preferred: 14.0, max: 35.0 }
    HDTV-720p:     { min: 2.0,  preferred: 25.0, max: 50.0 }
    WEBDL-720p:    { min: 2.0,  preferred: 25.0, max: 50.0 }
    WEBRip-720p:   { min: 2.0,  preferred: 25.0, max: 50.0 }
    Bluray-720p:   { min: 4.0,  preferred: 30.0, max: 55.0 }
    HDTV-1080p:    { min: 4.0,  preferred: 50.0, max: 80.0 }
    WEBDL-1080p:   { min: 4.0,  preferred: 50.0, max: 80.0 }
    WEBRip-1080p:  { min: 4.0,  preferred: 50.0, max: 80.0 }
    Bluray-1080p:  { min: 10.0, preferred: 65.0, max: 90.0 }

# ---------------------------------------------------------------------------
# Custom Formats — release-quality scoring
# ---------------------------------------------------------------------------
# Scores release attributes to STEER selection within a quality tier. Higher
# scores are preferred; negative scores penalise but do NOT block. No default
# format hard-blocks — file size is gated by the quality_definitions bounds,
# not here. (-10000 still hard-blocks if you want it; none does by default.)
# Set a score to 0 to make a format neutral. Delete this section to skip.
#
# Format definitions: scripts/lib/arr/custom_formats.yml
custom_formats:
  "Repack/Proper":  5
  "x264":           0
  "x265 (HD)":      0
  "BR-DISK":        0
  "LQ":             -100
  "No-RlsGroup":    -10
  "Obfuscated":     -10

# ---------------------------------------------------------------------------
# Disk Space Protection
# ---------------------------------------------------------------------------
# Minimum free disk space (GB) before Sonarr/Radarr stop importing and
# grabbing new releases. Applied as minimumFreeSpaceWhenImporting in each
# app's Media Management settings. Set to 0 to disable (restores 100 MB default).
min_free_space_gb: 20

# ---------------------------------------------------------------------------
# qBittorrent
# ---------------------------------------------------------------------------
qbittorrent:
  save_path: "/data/torrents"
  temp_path: "/data/torrents/incomplete"
  max_ratio: 1
  max_seeding_time: 1440            # minutes (1440 = 24h). Pauses torrents after this time.
  max_active_downloads: 5
  max_active_uploads: 5
  max_active_torrents: 10
  dl_speed_limit: 0              # MB/s (0 = unlimited). .env QBT_DL_LIMIT overrides.
  ul_speed_limit: 0              # MB/s (0 = unlimited). .env QBT_UL_LIMIT overrides.
  categories:
    tv-sonarr: "/data/torrents/tv"
    radarr: "/data/torrents/movies"

# ---------------------------------------------------------------------------
# Sonarr
# ---------------------------------------------------------------------------
sonarr:
  root_folder: "/data/media/tv"
  download_client_category: "tv-sonarr"

# ---------------------------------------------------------------------------
# Radarr
# ---------------------------------------------------------------------------
radarr:
  root_folder: "/data/media/movies"
  download_client_category: "radarr"

# ---------------------------------------------------------------------------
# Seerr
# ---------------------------------------------------------------------------
seerr:
  quotas:
    movie:
      limit: 0                     # Max movie requests per period (0 = unlimited)
      days: 7                      # Period in days
    tv:
      limit: 0                     # Max TV requests per period (0 = unlimited)
      days: 7                      # Period in days

# ---------------------------------------------------------------------------
# Bazarr - Subtitle Management
# ---------------------------------------------------------------------------
bazarr:
  languages:
    - english

# ---------------------------------------------------------------------------
# Jellyfin Libraries
# ---------------------------------------------------------------------------
jellyfin:
  server_name: "MediaStack"       # Displayed in Jellyfin Dashboard header and browser tab.
  remote_bitrate_limit: 0         # Mbps per remote viewer (0 = unlimited). Set by wizard.
  libraries:
    - name: "Movies"
      type: "movies"
      path: "/data/media/movies"
    - name: "TV Shows"
      type: "tvshows"
      path: "/data/media/tv"

# ---------------------------------------------------------------------------
# Rate Limiting (nginx via NPM)
# ---------------------------------------------------------------------------
# DISABLED BY DEFAULT. Neither Jellyfin's nor Seerr's official reverse-proxy
# config rate-limits, and a blanket nginx limit_req applies to EVERY path including
# media streaming and image loads: a multi-device household behind one NAT'd
# residential IP can hit 429s mid-playback, and the [npm-ratelimit] fail2ban jail
# can then ban the household's own public IP. Login brute-force stays covered by
# the jellyfin/seerr/npm 401/403 fail2ban jails regardless of this setting.
#
# To re-enable, set enabled: true AND enable the [npm-ratelimit] jail in
# config/fail2ban/jail.d/mediastack.conf. The settings below apply only when enabled.
rate_limiting:
  enabled: false                   # Master switch (off = upstream parity, no nginx limit_req)
  requests_per_second: 15          # Sustained rate per IP
  burst: 60                        # Burst bucket (absorbs page-load spikes)
  ban_maxretry: 10                 # 429 responses within ban_findtime triggers ban
  ban_findtime: 60                 # Seconds to accumulate ban_maxretry 429s
