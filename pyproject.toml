# Developer tooling only. MediaStack ships no Python package and installs
# no pip runtime dependency; this file configures Ruff (see tools.toml).

[tool.ruff]
line-length = 100
target-version = "py39"        # Debian 11 floor, docs/project/stack.md
extend-exclude = ["config/examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "C901", "SIM", "RET", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"          # Debian 11 floor, docs/project/stack.md
check_untyped_defs = true       # also type-check unannotated function bodies
disallow_untyped_defs = true    # every function must declare its full signature
exclude = ["config/examples"]
