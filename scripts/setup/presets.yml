# Quality model for the MediaStack setup wizard — two orthogonal axes.
#
# A quality profile is composed at apply time from a (resolution × size) CELL:
#   resolution = the desired CEILING (enables every tier from the SD floor up to
#                that ceiling, all sources) + the cutoff group upgrades stop at.
#   size       = the file-size ENVELOPE only (per-tier min/preferred/max bounds +
#                custom-format scores). Source-agnostic: a size does NOT filter
#                WEB vs HDTV/Bluray — every size includes the full tier ladder.
#
# Composition (scripts/setup/wizard_apply.py:compose_cell) emits the SAME
# config.yml sections the renderer already reads (quality_profile /
# quality_definitions / custom_formats), so render/*.py and configure.sh are
# unchanged. Profile name = "{resolution} {size}", e.g. "1080p Balanced".
#
# Adding a resolution (e.g. 2160p/4K) is a PURE DATA change here: add a block to
# `resolutions` (tier names + cutoff_group + per-size `size_hints`) and any new
# ids to `quality_ids`.
# Proven by tests/unit/wizard-composition.sh.
#
# See docs/reference/quality-bounds.md for the scalar size model, the SD floor,
# and the TRaSH rationale.

# ---------------------------------------------------------------------------
# Quality IDs — the ONLY place numeric Sonarr/Radarr quality IDs live.
# Tier NAMES are shared across apps; some numeric IDs differ (Bluray-480p is 13
# in Sonarr but 20 in Radarr). render/quality_definitions.py matches tiers by
# NAME against the live default profile; only the enabled-id MASK in
# quality_profile needs these numbers. Confirmed against each app's default
# profile in the wizard-presets DinD bring-up.
# ---------------------------------------------------------------------------
quality_ids:
  sonarr:
    SDTV: 1
    DVD: 2
    WEBDL-480p: 8
    WEBRip-480p: 12
    Bluray-480p: 13
    HDTV-720p: 4
    WEBDL-720p: 5
    WEBRip-720p: 14
    Bluray-720p: 6
    HDTV-1080p: 9
    WEBDL-1080p: 3
    WEBRip-1080p: 15
    Bluray-1080p: 7
    # Remux-1080p=30 — deliberately excluded from every cell (home-server audience)
  radarr:
    SDTV: 1
    DVD: 2
    WEBDL-480p: 8
    WEBRip-480p: 12
    Bluray-480p: 20
    HDTV-720p: 4
    WEBDL-720p: 5
    WEBRip-720p: 14
    Bluray-720p: 6
    HDTV-1080p: 9
    WEBDL-1080p: 3
    WEBRip-1080p: 15
    Bluray-1080p: 7
    # Remux-1080p=30 — deliberately excluded from every cell

# ---------------------------------------------------------------------------
# Resolutions — the "universe" of a cell: which tiers are enabled (names, floor
# → ceiling, all sources) and which group upgrades stop at. App-agnostic.
# upgrade_allowed is constant true for every cell (set in compose_cell).
# Group IDs: WEB 720p=1001, WEB 1080p=1002, WEB 2160p=1003 (future).
# `size_hints` carries the per-size GB/movie estimate shown in the size menu AT
# this resolution (quality-bounds.md "Cells at a glance") — a cell (res × size)
# value, so it lives here, not under `sizes`. A missing entry just omits the hint
# for that cell (so adding a resolution stays a single localised data block).
# ---------------------------------------------------------------------------
resolutions:
  720p:
    display_name: "720p"
    description: "Smaller library, lower bandwidth. Good for limited storage or slower connections."
    cutoff_group: 1001
    size_hints:
      compact:  "~1.5-3 GB/movie"
      balanced: "~2-4 GB/movie"
      large:    "~3-5 GB/movie"
    tiers:
      - SDTV
      - DVD
      - WEBDL-480p
      - WEBRip-480p
      - Bluray-480p
      - HDTV-720p
      - WEBDL-720p
      - WEBRip-720p
      - Bluray-720p
  1080p:
    display_name: "1080p"
    description: "Full HD. Recommended for most users."
    cutoff_group: 1002
    size_hints:
      compact:  "~2-4 GB/movie"
      balanced: "~4-8 GB/movie"
      large:    "~6-15 GB/movie"
    tiers:
      - SDTV
      - DVD
      - WEBDL-480p
      - WEBRip-480p
      - Bluray-480p
      - HDTV-720p
      - WEBDL-720p
      - WEBRip-720p
      - Bluray-720p
      - HDTV-1080p
      - WEBDL-1080p
      - WEBRip-1080p
      - Bluray-1080p
  # 2160p: future epic — pure data add (tiers + cutoff_group 1003 + 2160p quality_ids)

# ---------------------------------------------------------------------------
# Sizes — the file-size ENVELOPE only. `balanced` is the authored 1.0×
# reference; `compact` ≈ 0.7× and `large` ≈ 1.2× its preferred/max (mins are the
# source floor, size-independent). Bounds are MB/min (Sonarr per-episode, Radarr
# per-movie); preferred sits in the middle of what real sources produce, max is a
# sane ceiling — NOT TRaSH's "unlimited" (see docs/reference/quality-bounds.md).
# The 720p/1080p balanced+large rows carry the calibrated reference values;
# the SD-floor rows and compact's non-WEB rows are derived from the scalar model.
# Tables are full (SD → 1080p); composition MASKS them to the resolution's tiers.
#
# custom_format_scores are intentionally IDENTICAL across all three sizes —
# release-quality scoring is size-independent; the size axis is the bounds
# envelope only. No format hard-blocks by default (only -10000 would, and none
# is used); oversized releases are gated by the bounds. Kept as three blocks
# (not shared) so a future preset could diverge them (e.g. a 4K size).
# ---------------------------------------------------------------------------
