        HDTV-1080p:    { min: 18.0, preferred: 55.0, max: 90.0  }
        WEBDL-1080p:   { min: 12.0, preferred: 55.0, max: 85.0  }
        WEBRip-1080p:  { min: 12.0, preferred: 55.0, max: 85.0  }
        Bluray-1080p:  { min: 30.0, preferred: 80.0, max: 125.0 }
      radarr:
        HDTV-720p:     { min: 2.0,  preferred: 30.0, max: 60.0  }
        WEBDL-720p:    { min: 2.0,  preferred: 30.0, max: 60.0  }
        WEBRip-720p:   { min: 2.0,  preferred: 30.0, max: 60.0  }
        Bluray-720p:   { min: 4.0,  preferred: 40.0, max: 65.0  }
        HDTV-1080p:    { min: 4.5,  preferred: 55.0, max: 90.0  }
        WEBDL-1080p:   { min: 4.3,  preferred: 55.0, max: 85.0  }
